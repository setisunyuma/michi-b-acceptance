name: Verify MICHI guest greeting
on:
  push:
    branches: [ci/guest-greeting-002]

permissions: {}
concurrency: michi-guest-002-fixed-tests
env:
  REPO: setisunyuma/michi-b-acceptance
  AUDITED_HEAD: 637800c551b1eea1996e80e0e3c42dd0044fd1d0
  AUDITED_BASE: 1012c5d2072536e57292a8471eeac66890388db4

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load the audited source and project test
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = "$REPO"
          git init -q
          git fetch -q --depth=1 "https://github.com/$REPO.git" "$AUDITED_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$AUDITED_HEAD"
          git show "$AUDITED_HEAD:greeting.py" > greeting.py
          git show "$AUDITED_HEAD:tests/test_greeting.py" > test_greeting.py
      - name: Run four fixed acceptance tests and one project test
        shell: bash
        run: |
          cat > test_fixed.py <<'PY'
          import unittest
          from greeting import greet

          class Acceptance(unittest.TestCase):
              def test_plain(self):
                  self.assertEqual(greet("Ada"), "Hello, Ada!")

              def test_surrounding(self):
                  self.assertEqual(greet("  Ada  "), "Hello, Ada!")

              def test_empty(self):
                  self.assertEqual(greet(""), "Hello, guest!")

              def test_whitespace_only(self):
                  self.assertEqual(greet(" \t  "), "Hello, guest!")
          PY
          python3 - <<'PY'
          import sys
          import unittest

          for module, expected in (("test_fixed", 4), ("test_greeting", 1)):
              tests = unittest.defaultTestLoader.loadTestsFromName(module)
              if tests.countTestCases() != expected:
                  sys.exit(f"Unexpected test count in {module}")
              result = unittest.TextTestRunner(verbosity=2).run(tests)
              if (result.testsRun != expected or not result.wasSuccessful()
                      or result.skipped or result.expectedFailures):
                  sys.exit(1)
          PY

  report:
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Record the result on the audited commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          remote="https://github.com/$REPO.git"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = "$AUDITED_BASE"
          test "$(git ls-remote "$remote" refs/heads/trial/guest-greeting-002 | cut -f1)" = "$AUDITED_HEAD"
          case "$TEST_RESULT" in
            success) conclusion=success ;;
            failure) conclusion=failure ;;
            *) exit 1 ;;
          esac
          endpoint="repos/$REPO"
          id="michi-guest-002-fixed-tests-$AUDITED_HEAD"
          details="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh api "$endpoint/commits/$AUDITED_HEAD/check-runs?check_name=fixed-tests&filter=all&per_page=100")
          fields=(-f name=fixed-tests -f status=completed -f "conclusion=$conclusion"
                  -f "external_id=$id" -f "details_url=$details")
          if jq -e '.total_count == 0' <<< "$existing" >/dev/null; then
            gh api -X POST "$endpoint/check-runs" -f "head_sha=$AUDITED_HEAD" "${fields[@]}" --jq '{id,name,head_sha,conclusion}'
          else
            check=$(jq -er --arg id "$id" --arg sha "$AUDITED_HEAD" '
              select(.total_count == 1 and (.check_runs|length) == 1) | .check_runs[0] |
              select(.app.slug == "github-actions" and .external_id == $id and .head_sha == $sha) | .id
            ' <<< "$existing")
            gh api -X PATCH "$endpoint/check-runs/$check" "${fields[@]}" --jq '{id,name,head_sha,conclusion}'
          fi
